<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Chatbot</title>
    <link rel="stylesheet" href="../css/cb.css">
</head>
<body>
    <!-- Header avec logo à gauche et liens à droite -->
    <div class="header">
        <div class="logo-container">
            <img src="../Image/Logo_Kplonnubi.png" alt="Logo" class="logo">
        </div>
        <div class="header-links">
            <a href="./about.html">À propos</a>
            <a href="#contact">Contact</a>
        </div>
    </div>

    <!-- Contenu principal -->
    <div class="container">
        <!-- Texte à gauche -->
        <div class="text-container">
            <h1>KPLONNUBI</h1>
            <p>
                La première IA made in Bénin qui répond à toutes vos questions sur les services publics au Bénin.
            </p>
            <a href="./chat.html" class="start-btn">Commencer le Chat</a>
        </div>

        <!-- Carrousel à droite -->
        <div class="carousel">
            <div class="carousel-images">
                <img src="../Image/carroussel1.jpg" alt="Image aléatoire 1">
                <img src="../Image/carroussel2.jpg" alt="Image aléatoire 2">
                <img src="../Image/carroussel3.jpg" alt="Image aléatoire 3">
            </div>

            <div class="carousel-text-container">
                <div class="carousel-text">
                    Gagner du temps sur vos démarches administratives
                </div>
            </div>

        </div>
        
        
    </div>

     
    <!-- Lien vers le fichier JavaScript -->
    <script src="../js/cb.js"></script>
</body>
</html>
